    <text x="99" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#581c87">LoanBuilder</text>
    <text x="10" y="50" font-size="10" fill="#1e293b">+ SetBorrower / SetAmount</text>
    <text x="10" y="64" font-size="10" fill="#1e293b">+ SetTerms / Build()</text>
  </g>
  <g transform="translate(706, 294)">
    <rect width="182" height="44" rx="5" fill="#ffffff" stroke="#475569" stroke-width="1.3"/>
    <text x="91" y="26" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">StandardLoanBuilder</text>
  </g>
  <g transform="translate(706, 380)">
    <rect width="182" height="58" rx="5" fill="#faf5ff" stroke="#7e22ce" stroke-width="1.3"/>
    <line x1="0" y1="25" x2="182" y2="25" stroke="#7e22ce" stroke-width="1"/>
    <text x="91" y="17" text-anchor="middle" font-size="11" font-weight="700" fill="#581c87">LoanAgreement</text>
    <text x="10" y="40" font-size="9.5" fill="#1e293b">Number, Borrower, Amount</text>
    <text x="10" y="52" font-size="9.5" fill="#1e293b">Rate, Months, Monthly, Total</text>
  </g>

  <!-- Facade Connections -->
  <line x1="330" y1="64" x2="246" y2="64" stroke="#334155" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="590" y1="61" x2="666" y2="61" stroke="#334155" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 355 120 L 355 148 L 128 148 L 128 183" fill="none" stroke="#334155" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 410 120 L 410 164 L 352 164 L 352 183" fill="none" stroke="#334155" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 520 120 L 520 158 L 572 158 L 572 183" fill="none" stroke="#334155" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Director to LoanBuilder -->
  <line x1="796" y1="94" x2="796" y2="183" stroke="#334155" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Factory relations -->
  <path d="M 120 296 L 130 296 L 130 249" fill="none" stroke="#334155" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#impl)"/>
  <path d="M 120 342 L 130 342 L 130 296" fill="none" stroke="#334155" stroke-width="1.2" stroke-dasharray="4,3"/>
  <path d="M 120 388 L 130 388 L 130 342" fill="none" stroke="#334155" stroke-width="1.2" stroke-dasharray="4,3"/>
  <path d="M 191 247 L 191 313" fill="none" stroke="#334155" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="196" y="284" font-size="9" fill="#475569">creates</text>

  <!-- Strategy relations -->
  <line x1="352" y1="247" x2="352" y2="280" stroke="#334155" stroke-width="1.3" marker-start="url(#aggr)" marker-end="url(#arrow)"/>
  <path d="M 300 382 L 300 364 L 352 364 L 352 346" fill="none" stroke="#334155" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#impl)"/>
  <path d="M 404 382 L 404 364 L 352 364" fill="none" stroke="#334155" stroke-width="1.2" stroke-dasharray="4,3"/>
  <path d="M 352 428 L 352 364" fill="none" stroke="#334155" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- Observer relations -->
  <line x1="572" y1="257" x2="572" y2="288" stroke="#334155" stroke-width="1.3" marker-start="url(#aggr)" marker-end="url(#arrow)"/>
  <path d="M 514 386 L 514 368 L 572 368 L 572 350" fill="none" stroke="#334155" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#impl)"/>
  <path d="M 621 386 L 621 368 L 572 368" fill="none" stroke="#334155" stroke-width="1.2" stroke-dasharray="4,3"/>
  <path d="M 569 434 L 569 368" fill="none" stroke="#334155" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- Builder relations -->
  <line x1="797" y1="294" x2="797" y2="259" stroke="#334155" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#impl)"/>
  <line x1="797" y1="338" x2="797" y2="378" stroke="#334155" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <g transform="translate(24, 482)">
    <rect width="872" height="34" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="14" y="21" font-size="10.5" font-weight="700" fill="#334155">Legend:</text>
    <line x1="70" y1="17" x2="106" y2="17" stroke="#334155" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="112" y="21" font-size="10" fill="#334155">Uses / Calls</text>
    <line x1="186" y1="17" x2="222" y2="17" stroke="#334155" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#impl)"/>
    <text x="228" y="21" font-size="10" fill="#334155">Implements interface</text>
    <line x1="348" y1="17" x2="384" y2="17" stroke="#334155" stroke-width="1.3" marker-start="url(#aggr)" marker-end="url(#arrow)"/>
    <text x="390" y="21" font-size="10" fill="#334155">Holds / Aggregates</text>
    <rect x="498" y="9" width="14" height="14" rx="2" fill="#eff6ff" stroke="#1d4ed8"/>
    <text x="517" y="20" font-size="10" fill="#334155">Facade</text>
    <rect x="570" y="9" width="14" height="14" rx="2" fill="#f0fdf4" stroke="#15803d"/>
    <text x="589" y="20" font-size="10" fill="#334155">Factory</text>
    <rect x="642" y="9" width="14" height="14" rx="2" fill="#fefce8" stroke="#a16207"/>
    <text x="661" y="20" font-size="10" fill="#334155">Strategy</text>
    <rect x="718" y="9" width="14" height="14" rx="2" fill="#fef2f2" stroke="#b91c1c"/>
    <text x="737" y="20" font-size="10" fill="#334155">Observer</text>
    <rect x="798" y="9" width="14" height="14" rx="2" fill="#faf5ff" stroke="#7e22ce"/>
    <text x="817" y="20" font-size="10" fill="#334155">Builder</text>
  </g>
</svg>

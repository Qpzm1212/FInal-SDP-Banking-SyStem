<svg viewBox="0 0 920 530" width="100%" xmlns="http://www.w3.org/2000/svg" style="font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="impl" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#ffffff" stroke="#334155" stroke-width="1.4"/>
    </marker>
    <marker id="aggr" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="10" markerHeight="8" orient="auto">
      <path d="M 1 5 L 7 1 L 13 5 L 7 9 z" fill="#ffffff" stroke="#334155" stroke-width="1.3"/>
    </marker>
  </defs>

  <rect width="920" height="530" fill="#fcfdff" stroke="#e2e8f0" rx="8"/>

  <!-- BankFacade (Top Center) -->
  <g transform="translate(330, 16)">
    <rect width="260" height="104" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
    <line x1="0" y1="28" x2="260" y2="28" stroke="#1d4ed8" stroke-width="1.2"/>
    <text x="130" y="19" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">BankFacade</text>
    <text x="10" y="45" font-size="10.5" fill="#1e293b">+ OpenAccount(accType, accID)</text>
    <text x="10" y="60" font-size="10.5" fill="#1e293b">+ Transfer(accID, amount)</text>
    <text x="10" y="75" font-size="10.5" fill="#1e293b">+ ApplyForLoan(borrower, amount)</text>
    <text x="10" y="90" font-size="10.5" fill="#1e293b">+ CalculateYield(accType, balance)</text>
  </g>

  <!-- LedgerStore Singleton (Top Left) -->
  <g transform="translate(24, 20)">
    <rect width="220" height="92" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <line x1="0" y1="35" x2="220" y2="35" stroke="#334155" stroke-width="1.1"/>
    <text x="110" y="14" text-anchor="middle" font-size="9.5" fill="#475569">&lt;&lt;Singleton&gt;&gt;</text>
    <text x="110" y="28" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">LedgerStore</text>
    <text x="10" y="51" font-size="10.5" fill="#1e293b">+ GetDBInstance() *LedgerStore</text>
    <text x="10" y="66" font-size="10.5" fill="#1e293b">+ SaveAccount(acct) error</text>
    <text x="10" y="81" font-size="10.5" fill="#1e293b">+ ApplyDebit(entry) (float64, error)</text>
  </g>

  <!-- LoanDirector (Top Right) -->
  <g transform="translate(668, 28)">
    <rect width="228" height="66" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <line x1="0" y1="26" x2="228" y2="26" stroke="#334155" stroke-width="1.1"/>
    <text x="114" y="18" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">LoanDirector</text>
    <text x="10" y="45" font-size="10.5" fill="#1e293b">+ ConstructStandardLoan(b, name, amt)</text>
  </g>

  <!-- Factory Method Group (Bottom Left) -->
  <g transform="translate(20, 185)">
    <rect width="215" height="62" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
    <line x1="0" y1="34" x2="215" y2="34" stroke="#15803d" stroke-width="1.1"/>
    <text x="107" y="14" text-anchor="middle" font-size="9.5" fill="#166534">&lt;&lt;interface&gt;&gt;</text>
    <text x="107" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">AccountCreator</text>
    <text x="10" y="51" font-size="10.5" fill="#1e293b">+ CreateAccount(id) Account</text>
  </g>
  <g transform="translate(18, 280)">
    <rect width="102" height="32" rx="4" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
    <text x="51" y="20" text-anchor="middle" font-size="10" font-weight="600" fill="#0f172a">CheckingCreator</text>
  </g>
  <g transform="translate(18, 326)">
    <rect width="102" height="32" rx="4" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
    <text x="51" y="20" text-anchor="middle" font-size="10" font-weight="600" fill="#0f172a">SavingsCreator</text>
  </g>
  <g transform="translate(18, 372)">
    <rect width="102" height="32" rx="4" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
    <text x="51" y="20" text-anchor="middle" font-size="10" font-weight="600" fill="#0f172a">CreditCreator</text>
  </g>
  <g transform="translate(142, 315)">
    <rect width="98" height="58" rx="5" fill="#f0fdf4" stroke="#15803d" stroke-width="1.4"/>
    <line x1="0" y1="30" x2="98" y2="30" stroke="#15803d" stroke-width="1"/>
    <text x="49" y="13" text-anchor="middle" font-size="9" fill="#166534">&lt;&lt;interface&gt;&gt;</text>
    <text x="49" y="25" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14532d">Account</text>
    <text x="8" y="43" font-size="9" fill="#1e293b">+ GetID/Type()</text>
    <text x="8" y="54" font-size="9" fill="#1e293b">+ Credit/MaxLimit</text>
  </g>

  <!-- Strategy Group (Middle Left-Center) -->
  <g transform="translate(260, 185)">
    <rect width="185" height="62" rx="6" fill="#fefce8" stroke="#a16207" stroke-width="1.5"/>
    <line x1="0" y1="26" x2="185" y2="26" stroke="#a16207" stroke-width="1.1"/>
    <text x="92" y="18" text-anchor="middle" font-size="12" font-weight="700" fill="#713f12">InterestContext</text>
    <text x="10" y="41" font-size="10" fill="#1e293b">+ SetStrategy(s)</text>
    <text x="10" y="54" font-size="10" fill="#1e293b">+ ExecuteStrategy(bal)</text>
  </g>
  <g transform="translate(260, 282)">
    <rect width="185" height="62" rx="6" fill="#fefce8" stroke="#a16207" stroke-width="1.5"/>
    <line x1="0" y1="34" x2="185" y2="34" stroke="#a16207" stroke-width="1.1"/>
    <text x="92" y="14" text-anchor="middle" font-size="9.5" fill="#854d0e">&lt;&lt;interface&gt;&gt;</text>
    <text x="92" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="#713f12">InterestStrategy</text>
    <text x="10" y="51" font-size="10" fill="#1e293b">+ CalculateInterest(bal)</text>
  </g>
  <g transform="translate(254, 382)">
    <rect width="92" height="32" rx="4" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
    <text x="46" y="20" text-anchor="middle" font-size="9.5" font-weight="600" fill="#0f172a">SavingsStrategy</text>
  </g>
  <g transform="translate(358, 382)">
    <rect width="92" height="32" rx="4" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
    <text x="46" y="20" text-anchor="middle" font-size="9.5" font-weight="600" fill="#0f172a">LoanStrategy</text>
  </g>
  <g transform="translate(302, 428)">
    <rect width="102" height="30" rx="4" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
    <text x="51" y="19" text-anchor="middle" font-size="9.5" font-weight="600" fill="#0f172a">CheckingStrategy</text>
  </g>

  <!-- Observer Group (Middle Right-Center) -->
  <g transform="translate(470, 185)">
    <rect width="205" height="72" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
    <line x1="0" y1="26" x2="205" y2="26" stroke="#b91c1c" stroke-width="1.1"/>
    <text x="102" y="18" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">TransactionMonitor</text>
    <text x="10" y="42" font-size="10" fill="#1e293b">+ AddObserver(o)</text>
    <text x="10" y="55" font-size="10" fill="#1e293b">+ Notify(e)</text>
    <text x="10" y="67" font-size="10" fill="#1e293b">+ ProcessTransaction(amt, id)</text>
  </g>
  <g transform="translate(470, 290)">
    <rect width="205" height="58" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
    <line x1="0" y1="32" x2="205" y2="32" stroke="#b91c1c" stroke-width="1.1"/>
    <text x="102" y="13" text-anchor="middle" font-size="9.5" fill="#991b1b">&lt;&lt;interface&gt;&gt;</text>
    <text x="102" y="26" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">Observer</text>
    <text x="10" y="48" font-size="10" fill="#1e293b">+ Update(e *TransactionEvent)</text>
  </g>
  <g transform="translate(465, 386)">
    <rect width="98" height="32" rx="4" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
    <text x="49" y="20" text-anchor="middle" font-size="10" font-weight="600" fill="#0f172a">FraudDetector</text>
  </g>
  <g transform="translate(572, 386)">
    <rect width="98" height="32" rx="4" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
    <text x="49" y="20" text-anchor="middle" font-size="10" font-weight="600" fill="#0f172a">AuditLogger</text>
  </g>
  <g transform="translate(505, 434)">
    <rect width="128" height="32" rx="4" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>
    <text x="64" y="20" text-anchor="middle" font-size="10" font-weight="600" fill="#0f172a">SecurityTeamAlert</text>
  </g>


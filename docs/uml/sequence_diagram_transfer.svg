<svg viewBox="0 0 920 420" width="100%" xmlns="http://www.w3.org/2000/svg" style="font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <marker id="s-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
    <marker id="s-ret" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#475569" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect width="920" height="420" fill="#fcfdff" stroke="#e2e8f0" rx="8"/>

  <!-- Participants -->
  <g font-size="10.5" font-weight="700" text-anchor="middle" fill="#0f172a">
    <rect x="18" y="14" width="84" height="34" rx="5" fill="#eff6ff" stroke="#1d4ed8"/><text x="60" y="35">Client</text>
    <rect x="122" y="14" width="106" height="34" rx="5" fill="#f8fafc" stroke="#334155"/><text x="175" y="35">main.go (Echo)</text>
    <rect x="248" y="14" width="100" height="34" rx="5" fill="#eff6ff" stroke="#1d4ed8"/><text x="298" y="35">BankFacade</text>
    <rect x="368" y="14" width="96" height="34" rx="5" fill="#f8fafc" stroke="#334155"/><text x="416" y="35">LedgerStore</text>
    <rect x="484" y="14" width="122" height="34" rx="5" fill="#fef2f2" stroke="#b91c1c"/><text x="545" y="35">TransactionMonitor</text>
    <rect x="626" y="14" width="94" height="34" rx="5" fill="#fef2f2" stroke="#b91c1c"/><text x="673" y="35">FraudDetector</text>
    <rect x="736" y="14" width="84" height="34" rx="5" fill="#fef2f2" stroke="#b91c1c"/><text x="778" y="35">AuditLogger</text>
    <rect x="832" y="14" width="76" height="34" rx="5" fill="#fef2f2" stroke="#b91c1c"/><text x="870" y="29">Security</text><text x="870" y="41" font-size="9.5">TeamAlert</text>
  </g>

  <!-- Lifelines -->
  <g stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,4">
    <line x1="60" y1="48" x2="60" y2="402"/>
    <line x1="175" y1="48" x2="175" y2="402"/>
    <line x1="298" y1="48" x2="298" y2="402"/>
    <line x1="416" y1="48" x2="416" y2="402"/>
    <line x1="545" y1="48" x2="545" y2="402"/>
    <line x1="673" y1="48" x2="673" y2="402"/>
    <line x1="778" y1="48" x2="778" y2="402"/>
    <line x1="870" y1="48" x2="870" y2="402"/>
  </g>

  <g font-size="9.8" fill="#1e293b" style="paint-order: stroke; stroke: #fcfdff; stroke-width: 5px; stroke-linejoin: round;">
    <line x1="60" y1="76" x2="173" y2="76" stroke="#1e293b" stroke-width="1.4" marker-end="url(#s-arrow)"/>
    <text x="116" y="70" text-anchor="middle">POST /api/transaction</text>

    <line x1="175" y1="102" x2="296" y2="102" stroke="#1e293b" stroke-width="1.4" marker-end="url(#s-arrow)"/>
    <text x="236" y="96" text-anchor="middle">Transfer(accID, amt)</text>

    <line x1="298" y1="130" x2="414" y2="130" stroke="#1e293b" stroke-width="1.4" marker-end="url(#s-arrow)"/>
    <text x="357" y="124" text-anchor="middle">GetAccount(accID)</text>

    <line x1="416" y1="156" x2="300" y2="156" stroke="#475569" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#s-ret)"/>
    <text x="357" y="150" text-anchor="middle" fill="#475569">account, balance &amp; cap check</text>

    <line x1="298" y1="184" x2="543" y2="184" stroke="#1e293b" stroke-width="1.4" marker-end="url(#s-arrow)"/>
    <text x="421" y="178" text-anchor="middle">ProcessTransaction(amt, accID)</text>

    <line x1="545" y1="212" x2="671" y2="212" stroke="#b91c1c" stroke-width="1.4" marker-end="url(#s-arrow)"/>
    <text x="609" y="206" text-anchor="middle" fill="#7f1d1d">1. Update(event) [AML/velocity]</text>

    <line x1="545" y1="240" x2="776" y2="240" stroke="#b91c1c" stroke-width="1.4" marker-end="url(#s-arrow)"/>
    <text x="660" y="234" text-anchor="middle" fill="#7f1d1d">2. Update(event) -> [AUDIT]</text>

    <line x1="545" y1="268" x2="868" y2="268" stroke="#b91c1c" stroke-width="1.4" marker-end="url(#s-arrow)"/>
    <text x="706" y="262" text-anchor="middle" fill="#7f1d1d">3. Update(event) -> [ALERT] if Suspicious</text>

    <line x1="545" y1="296" x2="300" y2="296" stroke="#475569" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#s-ret)"/>
    <text x="421" y="290" text-anchor="middle" fill="#475569">event (Suspicious, Reason)</text>

    <line x1="298" y1="324" x2="414" y2="324" stroke="#1e293b" stroke-width="1.4" marker-end="url(#s-arrow)"/>
    <text x="357" y="318" text-anchor="middle">ApplyDebit(entry)</text>

    <line x1="416" y1="350" x2="300" y2="350" stroke="#475569" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#s-ret)"/>
    <text x="357" y="344" text-anchor="middle" fill="#475569">newBalance</text>

    <line x1="298" y1="374" x2="177" y2="374" stroke="#475569" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#s-ret)"/>
    <text x="236" y="368" text-anchor="middle" fill="#475569">TransferResult</text>

    <line x1="175" y1="396" x2="62" y2="396" stroke="#475569" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#s-ret)"/>
    <text x="116" y="390" text-anchor="middle" fill="#475569">200 OK JSON</text>
  </g>
</svg>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Banking Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">GoBank System</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link active" href="/">Дашборд</a></li>
                <li class="nav-item"><a class="nav-link" href="/loan.html">Кредиты</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <h3>Новая транзакция</h3>
    <p class="text-muted">Если сумма превысит $10,000, сработает паттерн Observer (Фрод-контроль).</p>
    <form id="txForm" class="col-md-5">
        <input type="text" id="accId" class="form-control mb-3" placeholder="ID Счета (напр. ACC-123)" required>
        <input type="number" id="amount" class="form-control mb-3" placeholder="Сумма" required>
        <button type="submit" class="btn btn-primary">Отправить перевод</button>
    </form>
    <div id="txResult" class="mt-3 text-success"></div>
</div>

<script src="/static/app.js"></script>
</body>
</html>

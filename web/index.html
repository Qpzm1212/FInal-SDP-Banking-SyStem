<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>FINAL100B</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#F6F7FB;--card:#fff;--tx:#12142a;--mu:#6b7090;--bd:#e7e8f2;--ac:#5B3DF5;--bl:#3B82F6;--vi:#8B5CF6;--g:linear-gradient(135deg,#3B82F6 0%,#5B3DF5 55%,#8B5CF6 100%);--sh:0 8px 30px rgba(91,61,245,.08);--ok:#10B981;--er:#EF4444;--wr:#F59E0B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
        @media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B0D17;--card:#141829;--tx:#eef0ff;--mu:#9296b8;--bd:#23284a;--sh:0 8px 30px rgba(0,0,0,.35);color-scheme:dark}}
        :root[data-theme="dark"]{--bg:#0B0D17;--card:#141829;--tx:#eef0ff;--mu:#9296b8;--bd:#23284a;--sh:0 8px 30px rgba(0,0,0,.35);color-scheme:dark}
        *{box-sizing:border-box;margin:0}
        html{scroll-padding-top:env(safe-area-inset-top,0px)}
        body{font-family:Manrope,system-ui,sans-serif;background-color:var(--bg);background-image:url('back.png');background-attachment:fixed;background-size:cover;background-position:center;background-repeat:no-repeat;color:var(--tx);min-height:100vh;-webkit-font-smoothing:antialiased}
        a{color:inherit;text-decoration:none}
        button,input,select{font:inherit;color:inherit}
        :focus-visible{outline:3px solid var(--vi);outline-offset:2px}
        .top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--card) 85%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
        .top .in{max-width:1080px;margin:auto;display:flex;align-items:center;gap:24px;padding:12px 20px}
        .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.02em}
        .mark{width:32px;height:32px;border-radius:10px;background:var(--g);display:grid;place-items:center;color:#fff;font-size:16px}
        .links{display:flex;gap:4px;flex:1}
        .links a{padding:8px 14px;border-radius:12px;font-weight:600;font-size:14px;color:var(--mu)}
        .links a:hover{background:var(--bg)}
        .links a.on{background:rgba(91,61,245,.12);color:var(--ac)}
        .act{display:flex;gap:8px;align-items:center}
        .ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--bd);background:var(--card);display:grid;place-items:center;cursor:pointer;position:relative}
        .ib b{position:absolute;top:-5px;right:-5px;background:var(--er);color:#fff;font-size:11px;border-radius:9px;padding:1px 6px}
        svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
        .tabs{display:none}
        main{max-width:1080px;margin:auto;padding:28px 20px 100px}
        .h1{font-size:30px;font-weight:800;letter-spacing:-.03em}
        .sub{color:var(--mu);margin:6px 0 22px;max-width:60ch;line-height:1.5}
        .card{background:var(--card);border:1px solid var(--bd);border-radius:20px;box-shadow:var(--sh);padding:22px}
        .narrow{max-width:520px}
        label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
        input,select{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);font-size:15px}
        input:focus,select:focus{border-color:var(--ac);outline:none;box-shadow:0 0 0 4px rgba(91,61,245,.15)}
        .btn{margin-top:18px;width:100%;padding:14px;border:0;border-radius:14px;background:var(--g);color:#fff;font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 10px 24px rgba(91,61,245,.3);transition:transform .15s}
        .btn:hover{transform:translateY(-2px)}
        .btn:disabled{opacity:.6;cursor:progress;transform:none}
        .btn.ghost{background:var(--bg);color:var(--tx);box-shadow:none;border:1px solid var(--bd)}
        .row{display:flex;gap:12px}
        .row>*{flex:1}
        .grid{display:grid;gap:14px}
        .g4{grid-template-columns:repeat(4,1fr)}
        .g2{grid-template-columns:repeat(2,1fr)}
        .tile{display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:18px;background:var(--card);border:1px solid var(--bd);font-weight:700;font-size:14px;transition:transform .15s,box-shadow .15s}
        .tile:hover{transform:translateY(-3px);box-shadow:var(--sh)}
        .chip{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;background:var(--g)}
        .chip.v{background:linear-gradient(135deg,#8B5CF6,#5B3DF5)}
        .chip.b{background:linear-gradient(135deg,#60A5FA,#3B82F6)}
        .chip.d{background:linear-gradient(135deg,#312e81,#5B3DF5)}
        .small{font-size:13px;color:var(--mu);font-weight:500;line-height:1.4}
        .hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
        .bal{font-size:44px;font-weight:800;letter-spacing:-.04em;display:flex;align-items:center;gap:12px}
        .bal button{background:none;border:0;color:var(--mu);cursor:pointer}
        .cards{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 18px;margin-bottom:6px}
        .bc{flex:0 0 300px;height:176px;border-radius:22px;padding:20px;color:#fff;scroll-snap-align:start;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;box-shadow:0 14px 34px rgba(91,61,245,.28);transition:transform .2s}
        .bc:hover{transform:perspective(600px) rotateX(3deg) rotateY(-4deg)}
        .bc:after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.14)}
        .bc .n{font-size:26px;font-weight:800;letter-spacing:-.02em}
        .sec{font-size:18px;font-weight:800;margin:26px 0 12px}
        .tx{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--bd)}
        .tx:last-child{border:0}
        .tx .dot{width:40px;height:40px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-weight:800;color:var(--ac)}
        .tx .m{flex:1}
        .pos{color:var(--ok)}
        .badge{font-size:11px;font-weight:700;background:rgba(239,68,68,.14);color:var(--er);padding:3px 8px;border-radius:8px;margin-left:8px}
        .split{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
        .auth{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}
        .art{background:var(--g);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
        .art:before,.art:after{content:"";position:absolute;border-radius:50%;filter:blur(10px)}
        .art:before{width:420px;height:420px;background:rgba(255,255,255,.12);right:-120px;top:-100px}
        .art:after{width:300px;height:300px;background:rgba(14,165,233,.35);left:-80px;bottom:-60px}
        .art h2{font-size:44px;line-height:1.05;letter-spacing:-.04em;font-weight:800;max-width:11ch;position:relative;z-index:1}
        .glass{position:relative;z-index:1;width:300px;padding:20px;border-radius:22px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(18px);transform:rotate(-6deg);margin-left:40px;box-shadow:0 24px 50px rgba(20,10,80,.3)}
        .glass.two{transform:rotate(5deg);margin:-70px 0 0 150px;width:240px}
        .form{display:flex;flex-direction:column;justify-content:center;padding:48px;max-width:460px;margin:auto;width:100%}
        .seg{display:flex;background:var(--bg);border-radius:14px;padding:4px;margin:18px 0 6px}
        .seg button{flex:1;border:0;background:none;padding:10px;border-radius:11px;font-weight:700;cursor:pointer;color:var(--mu)}
        .seg button.on{background:var(--card);color:var(--ac);box-shadow:var(--sh)}
        .err{color:var(--er);font-size:13px;font-weight:600;margin-top:10px;min-height:18px}
        .toast{position:fixed;left:50%;top:20px;transform:translateX(-50%);z-index:50;background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--ok);padding:14px 18px;border-radius:14px;box-shadow:var(--sh);font-weight:600;max-width:90vw}
        .toast.warn{border-left-color:var(--er)}
        .steps{display:flex;gap:8px;margin-bottom:6px}
        .steps i{flex:1;height:6px;border-radius:4px;background:var(--bd)}
        .steps i.on{background:var(--g)}
        .doc{border:1px dashed var(--ac);border-radius:16px;padding:22px;margin-top:18px;line-height:1.8}
        .doc h3{margin-bottom:8px}
        .res{font-size:40px;font-weight:800;letter-spacing:-.03em;margin-top:6px}
        .feed{display:flex;flex-direction:column;gap:10px}
        .al{padding:12px 14px;border-radius:14px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);font-size:14px;font-weight:600}
        .offline{border-left:5px solid var(--er);margin-bottom:18px}
        @media(max-width:820px){
            .links,.top .act .hide-m{display:none}
            .tabs{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--card);border-top:1px solid var(--bd);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px))}
            .tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--mu);padding:4px}
            .tabs a.on{color:var(--ac)}
            .g4{grid-template-columns:repeat(2,1fr)}
            .split{grid-template-columns:1fr}
            .auth{grid-template-columns:1fr}
            .art{display:none}
            .form{padding:28px 20px}
            .bal{font-size:34px}
            .h1{font-size:25px}
        }
        @media(prefers-reduced-motion:reduce){*{transition:none!important}}
    </style>
</head>
<body>
<div id="app"></div>
<script>
    const $=s=>document.querySelector(s);
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const fmt=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n);
    const P={home:'M3 10l9-7 9 7v10a1 1 0 01-1 1h-5v-7H9v7H4a1 1 0 01-1-1z',card:'M3 6h18v12H3zM3 10h18',send:'M22 2L11 13M22 2l-7 20-4-9-9-4z',doc:'M6 2h9l5 5v15H6zM14 2v6h6M9 13h8M9 17h8',calc:'M5 3h14v18H5zM8 7h8M8 12h1M12 12h1M16 12h1M8 16h1M12 16h1M16 16h1',bell:'M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 01-3.4 0',moon:'M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z',out:'M9 21H5V3h4M16 17l5-5-5-5M21 12H9',eye:'M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12zM12 9a3 3 0 100 6 3 3 0 000-6z',star:'M12 2l3 7 7 .6-5.3 4.7 1.6 7.2L12 17.8 5.7 21.500l1.600-7.200L2 9.600 9 9z'};
    const ic=n=>`<svg class="i" viewBox="0 0 24 24"><path d="${P[n]}"/></svg>`;

    const META={checking:{label:'Checking',grad:'#3B82F6,#5B3DF5'},savings:{label:'Savings',grad:'#5B3DF5,#8B5CF6'},credit:{label:'Credit',grad:'#1e1b4b,#5B3DF5'}};
    const meta=t=>META[t]||META.checking;

    let S={user:null,theme:null};
    try{const s=JSON.parse(localStorage.getItem('nova')||'{}');S.user=s.user||null;S.theme=s.theme||null}catch(e){}
    const save=()=>{try{localStorage.setItem('nova',JSON.stringify(S))}catch(e){}};
    if(S.theme)document.documentElement.dataset.theme=S.theme;

    async function api(url,opt){
        let res;
        try{res=await fetch(url,Object.assign({cache:'no-store'},opt))}
        catch(e){throw Error('Cannot reach the server. Is the Go server running on :8080?')}
        let data={};try{data=await res.json()}catch(e){}
        if(!res.ok)throw Error(data.error||('Server error '+res.status));
        return data}
    const post=(url,p)=>api(url,{method:'POST',body:new URLSearchParams(p)});
    const Bank={
        accounts:()=>api('/api/accounts'),
        transactions:()=>api('/api/transactions'),
        open:(type,id)=>post('/api/account',{type,id}),
        transfer:(id,amount)=>post('/api/transaction',{account_id:id,amount}),
        loan:(borrower,amount)=>post('/api/loan',{borrower,amount}),
        interest:(type,balance)=>api('/api/interest?'+new URLSearchParams({type,balance}))};

    let D={acc:[],tx:[],error:null};
    async function load(){
        try{const r=await Promise.all([Bank.accounts(),Bank.transactions()]);D.acc=r[0];D.tx=r[1];D.error=null}
        catch(e){D.error=e.message}}
    const alerts=()=>D.tx.filter(t=>t.suspicious);

    function toast(m,w){const t=document.createElement('div');t.className='toast'+(w?' warn':'');t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
    function count(el,to){if(!el)return;const s=performance.now();const f=t=>{const p=Math.min(1,(t-s)/800);el.textContent=fmt(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)}

    const NAV=[['home','Home','home'],['accounts','Accounts','card'],['transfer','Transfer','send'],['loan','Loan','doc'],['calc','Calculator','calc']];
    function shell(route,html){
        const n=alerts().length;
        return `<header class="top"><div class="in"><a class="logo" href="#home"><span class="mark">F</span>FINAL100B</a>
 <nav class="links" aria-label="Main menu">${NAV.map(n=>`<a href="#${n[0]}" class="${n[0]===route?'on':''}">${n[1]}</a>`).join('')}</nav>
 <div class="act"><button class="ib" aria-label="Notifications" onclick="location.hash='#transfer'">${ic('bell')}${n?`<b>${n}</b>`:''}</button>
 <button class="ib" aria-label="Toggle theme" onclick="theme()">${ic('moon')}</button>
 <button class="ib" aria-label="Logout" onclick="logout()">${ic('out')}</button></div></div></header>
 <main>${html}</main>
 <nav class="tabs" aria-label="Bottom menu">${NAV.map(n=>`<a href="#${n[0]}" class="${n[0]===route?'on':''}">${ic(n[2])}${n[1]}</a>`).join('')}</nav>`}
    function theme(){const d=document.documentElement;const dark=d.dataset.theme?d.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;S.theme=dark?'light':'dark';d.dataset.theme=S.theme;save()}
    function logout(){S.user=null;save();location.hash='#login'}
    const offline=()=>`<div class="card offline" role="alert"><b>Server unavailable</b><p class="small" style="margin:6px 0 12px">${esc(D.error)}</p><button class="btn ghost" style="margin:0" onclick="render()">Retry</button></div>`;

    let mode='login',hide=false,step=1,loan={},contract=null,lastAcc=null;
    const V={};
    V.login=()=>`<div class="auth"><section class="art"><a class="logo"><span class="mark" style="background:rgba(255,255,255,.22)">F</span>FINAL100B</a>
 <div><h2>Money at Your Fingertips</h2><p style="margin:16px 0 40px;position:relative;z-index:1;max-width:34ch;line-height:1.5;opacity:.9">Accounts, transfers, and loans in one app. Open an account in a minute.</p>
 <div class="glass"><div class="small" style="color:#fff;opacity:.8">Checking</div><div style="font-size:28px;font-weight:800;margin:8px 0">$48,250.75</div><div style="opacity:.8">ACC-1</div></div>
 <div class="glass two"><div class="small" style="color:#fff;opacity:.8">Savings, 5% APY</div><div style="font-size:22px;font-weight:800;margin-top:6px">+$52.00</div></div></div><div></div></section>
 <section class="form"><h1 class="h1">${mode==='login'?'Sign In':'Create Account'}</h1><p class="sub" style="margin-bottom:0">${mode==='login'?'Enter your email and password to continue.':'Fill out the form and we\'ll set up your account.'}</p>
 <div class="seg"><button class="${mode==='login'?'on':''}" onclick="mode='login';render()">Sign In</button><button class="${mode==='reg'?'on':''}" onclick="mode='reg';render()">Register</button></div>
 <form id="af" novalidate>${mode==='reg'?'<label for="nm">Name</label><input id="nm" autocomplete="name" placeholder="First Last">':''}
 <label for="em">Email</label><input id="em" type="email" autocomplete="email" placeholder="you@example.com">
 <label for="pw">Password</label><div style="position:relative"><input id="pw" type="password" autocomplete="current-password" placeholder="At least 6 characters"><button type="button" class="ib" style="position:absolute;right:4px;top:3px;width:38px;height:38px;border:0" aria-label="Show password" onclick="const p=$('#pw');p.type=p.type==='password'?'text':'password'">${ic('eye')}</button></div>
 <label style="display:flex;gap:8px;align-items:center;font-weight:500"><input type="checkbox" style="width:auto" checked>Remember me</label>
 <div class="err" id="er" role="alert"></div><button class="btn" id="ab">${mode==='login'?'Sign In':'Create Account'}</button></form></section></div>`;
    V.login.bind=()=>{$('#af').onsubmit=e=>{e.preventDefault();const em=$('#em').value.trim(),pw=$('#pw').value,nm=$('#nm')?$('#nm').value.trim():'';let m='';
        if(mode==='reg'&&!nm)m='Enter your name';else if(!/^\S+@\S+\.\S+$/.test(em))m='Enter a valid email';else if(pw.length<6)m='Password must be at least 6 characters';
        $('#er').textContent=m;if(m)return;const b=$('#ab');b.textContent='Checking…';b.disabled=true;
        setTimeout(()=>{S.user={name:nm||em.split('@')[0],email:em};save();location.hash='#home'},400)}};

    V.home=()=>{const tot=D.acc.reduce((s,a)=>s+a.balance,0);const out=D.tx.filter(t=>!t.income).slice(0,7).reverse();const mx=Math.max(1,...out.map(t=>t.amount));
        return `<div class="hero"><div><div class="small">Hello, ${esc(S.user.name)}</div><div class="bal"><span id="tb">${hide?'••••••':fmt(tot)}</span><button aria-label="Hide balance" onclick="hide=!hide;render()">${ic('eye')}</button></div><div class="small">Total balance across all accounts</div></div></div>
 <div class="cards">${D.acc.map(a=>{const m=meta(a.type);return `<div class="bc" style="background:linear-gradient(135deg,${m.grad})"><div style="font-weight:700">${m.label}</div><div><div class="small" style="color:#fff;opacity:.75">${esc(a.id)}</div><div class="n">${hide?'••••••':fmt(a.balance)}</div></div></div>`}).join('')||'<p class="small">No accounts yet. Open your first one on the Accounts page.</p>'}</div>
 <div class="grid g4">${[['accounts','Open Account','card',''],['transfer','Transfer','send','b'],['loan','Loan','doc','v'],['calc','Interest','calc','d']].map(t=>`<a class="tile" href="#${t[0]}"><span class="chip ${t[3]}">${ic(t[2])}</span>${t[1]}</a>`).join('')}</div>
 <h2 class="sec">Products</h2><div class="grid g2">${[['Savings Account','5% APY, no fees or hidden terms','','star'],['Personal Loan','15% APR, contract in a minute online','v','doc'],['Deposit','Save and earn interest monthly','b','card'],['Cashback','Get part of your spending back','d','star']].map(p=>`<div class="tile" style="flex-direction:row;align-items:center;gap:14px"><span class="chip ${p[2]}" style="flex:none">${ic(p[3])}</span><span>${p[0]}<div class="small">${p[1]}</div></span></div>`).join('')}</div>
 <div class="split" style="margin-top:8px"><div><h2 class="sec">Recent Transactions</h2><div class="card" style="padding:8px 20px">${D.tx.slice(0,6).map(t=>`<div class="tx"><div class="dot">${esc((t.name||'T')[0])}</div><div class="m"><b>${esc(t.name||'Transfer')}</b>${t.suspicious?'<span class="badge">Suspicious</span>':''}<div class="small">${new Date(t.date).toLocaleDateString('en-US')}${t.account_id?' · '+esc(t.account_id):''}</div></div><b class="${t.income?'pos':''}">${t.income?'+':'−'}${fmt(t.amount)}</b></div>`).join('')||'<p class="small" style="padding:16px 0">No transactions yet. Make your first transfer.</p>'}</div></div>
 <div><h2 class="sec">Spending</h2><div class="card"><svg viewBox="0 0 280 140" width="100%" role="img" aria-label="Recent spending chart"><defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5B3DF5"/><stop offset="1" stop-color="#3B82F6"/></linearGradient></defs>${out.map((t,i)=>{const h=Math.max(6,t.amount/mx*110);return `<rect x="${i*40+8}" y="${130-h}" width="26" height="${h}" rx="8" fill="url(#gg)"/>`}).join('')}</svg><div class="small">Recent expenses</div></div></div></div>`};
    V.home.bind=()=>{if(!hide)count($('#tb'),D.acc.reduce((s,a)=>s+a.balance,0))};

    V.accounts=()=>{const m=lastAcc?meta(lastAcc.type):null;return `<h1 class="h1">Open Account</h1><p class="sub">Choose account type and create a number. The account will appear in your dashboard immediately.</p>
 <div class="card narrow"><form id="f"><label for="t">Account Type</label><select id="t"><option value="checking">Checking</option><option value="savings">Savings</option><option value="credit">Credit</option></select>
 <label for="n">Account Number</label><input id="n" placeholder="e.g., ACC-3" autocomplete="off"><div class="err" id="er" role="alert"></div><button class="btn">Open Account</button></form>
 ${lastAcc?`<div class="bc" style="margin-top:20px;flex:none;width:100%;background:linear-gradient(135deg,${m.grad})"><b>${m.label}</b><div><div class="small" style="color:#fff;opacity:.8">Account opened</div><div class="n">${esc(lastAcc.number)}</div></div></div>`:''}</div>`};
    V.accounts.bind=()=>{$('#f').onsubmit=async e=>{e.preventDefault();const er=$('#er'),b=$('#f button');er.textContent='';
        const n=$('#n').value.trim();if(!n)return er.textContent='Enter account number, e.g. ACC-3';
        b.disabled=true;
        try{const r=await Bank.open($('#t').value,n);lastAcc={type:r.account_type,number:r.account_id};toast('Account opened');await render()}
        catch(x){er.textContent=x.message;b.disabled=false}}};

    V.transfer=()=>`<h1 class="h1">New Transfer</h1><p class="sub">Amounts over $10,000 are flagged as suspicious: the system will alert the security monitor.</p>
 <div class="split"><div class="card"><form id="f"><label for="n">Account Number</label><input id="n" placeholder="e.g., ACC-1" list="al" autocomplete="off"><datalist id="al">${D.acc.map(a=>`<option value="${esc(a.id)}">`).join('')}</datalist>
 <label for="a">Amount, $</label><input id="a" type="number" min="0" step="0.01" placeholder="500"><div class="err" id="er" role="alert"></div><button class="btn">Send Transfer</button></form>
 <p class="small" style="margin-top:14px">Account must exist. Open it on the <a href="#accounts" style="color:var(--ac);font-weight:700">"Accounts"</a> page.</p></div>
 <div class="card"><b>Security Monitor</b><div class="feed" style="margin-top:14px">${alerts().slice(0,8).map(a=>`<div class="al">Suspicious transfer ${fmt(a.amount)} from ${esc(a.account_id)}<div class="small">${new Date(a.date).toLocaleString('en-US')}</div></div>`).join('')||'<p class="small">No alerts. All clear.</p>'}</div></div></div>`;
    V.transfer.bind=()=>{$('#f').onsubmit=async e=>{e.preventDefault();const er=$('#er'),b=$('#f button');er.textContent='';
        const n=$('#n').value.trim(),a=parseFloat($('#a').value);
        if(!n)return er.textContent='Enter account number';
        if(!(a>0))return er.textContent='Amount must be greater than zero';
        b.disabled=true;
        try{const r=await Bank.transfer(n,a);r.suspicious?toast('Suspicious transaction: '+fmt(a)+'. Security team notified.',1):toast('Transfer sent');await render()}
        catch(x){er.textContent=x.message;b.disabled=false}}};

    V.loan=()=>{const b=`<div class="steps">${[1,2,3].map(i=>`<i class="${i<=step?'on':''}"></i>`).join('')}</div>`;let c='';
        if(step===1)c=`<label for="bn">Borrower Name</label><input id="bn" value="${esc(loan.name||'')}" placeholder="First Last">`;
        else if(step===2)c=`<label for="ba">Loan Amount, $</label><input id="ba" type="number" min="100" value="${loan.amount||5000}">`;
        else c=`<div class="small" style="margin-top:14px;line-height:1.8">Borrower: <b>${esc(loan.name)}</b><br>Amount: <b>${fmt(loan.amount)}</b><br>Standard terms: <b>15% APR, 12 months</b></div>`;
        const ct=contract?`<div class="doc"><h3>Loan Agreement ${esc(contract.number)}</h3>Date: ${new Date(contract.date).toLocaleDateString('en-US')}<br>Borrower: ${esc(contract.borrower)}<br>Amount: ${fmt(contract.amount)}<br>Rate: ${contract.rate}% APR, term ${contract.months} months<br>Monthly payment: <b>${fmt(contract.monthly)}</b><br>Total to repay: <b>${fmt(contract.total)}</b><br><button class="btn ghost" onclick="print()">Print Agreement</button></div>`:'';
        return `<h1 class="h1">Apply for Loan</h1><p class="sub">Contract is built step by step: borrower, amount, standard terms.</p><div class="card narrow">${b}${contract?"":c}<div class="err" id="er" role="alert"></div>
 <div class="row">${step>1&&!contract?'<button class="btn ghost" onclick="step--;render()">Back</button>':''}${contract?'<button class="btn ghost" onclick="contract=null;loan={};step=1;render()">New Application</button>':`<button class="btn" id="nx">${step<3?'Next':'Generate Agreement'}</button>`}</div>${ct}</div>`};
    V.loan.bind=()=>{const nx=$('#nx');if(!nx)return;nx.onclick=async()=>{const er=$('#er');er.textContent='';
        if(step===1){const v=$('#bn').value.trim();if(!v)return er.textContent='Enter borrower name';loan.name=v;step=2;return render()}
        if(step===2){const v=parseFloat($('#ba').value);if(!(v>=100))return er.textContent='Minimum amount: $100';loan.amount=v;step=3;return render()}
        nx.disabled=true;
        try{contract=await Bank.loan(loan.name,loan.amount);toast('Agreement created');await render()}
        catch(x){er.textContent=x.message;nx.disabled=false}}};

    V.calc=()=>`<h1 class="h1">Interest Calculator</h1><p class="sub">Product type selects the calculation strategy: savings (5%) or credit (15%).</p>
 <div class="card narrow"><form id="f"><label for="t">Type</label><select id="t"><option value="savings">Savings</option><option value="credit">Credit</option></select>
 <label for="a">Amount, $</label><input id="a" type="number" min="0" step="any" value="1000"><div class="err" id="er" role="alert"></div><button class="btn">Calculate</button></form>
 <div id="rs" style="margin-top:18px"></div></div>`;
    V.calc.bind=()=>{$('#f').onsubmit=async e=>{e.preventDefault();const er=$('#er'),b=$('#f button');er.textContent='';
        const a=parseFloat($('#a').value);if(!(a>=0))return er.textContent='Enter amount';
        const t=$('#t').value;b.disabled=true;
        try{const r=await Bank.interest(t,a);
            $('#rs').innerHTML=`<div class="small">Annual interest (${t==='savings'?'5%':'15%'})</div><div class="res" id="rv"></div><div class="small" style="margin-top:8px">Total after one year: <b>${fmt(a+r.interest)}</b></div>`;count($('#rv'),r.interest)}
        catch(x){er.textContent=x.message}
        b.disabled=false}};

    let rid=0;
    async function render(){
        const my=++rid;
        let r=(location.hash||'#home').slice(1);if(!V[r])r='home';
        if(!S.user&&r!=='login'){location.hash='#login';return}
        if(S.user&&r==='login'){location.hash='#home';return}
        if(r!=='login')await load();
        if(my!==rid)return; // route changed while loading
        if(r==='login'){$('#app').innerHTML=V.login()}
        else if(D.error&&(r==='home'||r==='transfer')){$('#app').innerHTML=shell(r,offline())}
        else{$('#app').innerHTML=shell(r,(D.error?offline():'')+V[r]())}
        window.scrollTo(0,0);if(V[r].bind&&!(D.error&&(r==='home'||r==='transfer')))V[r].bind()}
    addEventListener('hashchange',()=>{step=1;render()});
    render();
</script>
</body>
</html>
